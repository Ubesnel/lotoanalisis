<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="refresh" content="60"/>
<title>LotoAnálisis · En mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --font-title: 'Baloo 2', 'Segoe UI', Roboto, Arial, sans-serif;
    --font-body: 'Nunito', 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font-body);
  }

  .bp-hero {
    position: relative;
    min-height: 100vh;
    background: linear-gradient(150deg,
      #6d28d9 0%, #7c3aed 30%, #8b5cf6 55%, #a78bfa 75%, #8b5cf6 88%, #7c3aed 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 100px 16px 80px;
  }

  .bp-orb { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(80px); }
  .bp-orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #f97316 0%, transparent 65%); top: -160px; right: -100px; opacity: .18; animation: bp-pulse 10s ease-in-out infinite; }
  .bp-orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #fbbf24 0%, transparent 65%); bottom: -80px; left: -80px; opacity: .15; animation: bp-pulse 12s ease-in-out infinite reverse; }
  .bp-orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, #3b82f6 0%, transparent 65%); top: 30%; left: 5%; opacity: .13; animation: bp-pulse 8s ease-in-out infinite 1s; }
  .bp-orb-4 { width: 250px; height: 250px; background: radial-gradient(circle, #f59e0b 0%, transparent 65%); bottom: 10%; right: 8%; opacity: .13; animation: bp-pulse 9s ease-in-out infinite 2s; }
  @keyframes bp-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

  .bp-stars {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.75) 0%, transparent 100%),
      radial-gradient(1px   1px   at 78% 10%, rgba(251,191,36,.9)  0%, transparent 100%),
      radial-gradient(2px   2px   at 53% 68%, rgba(255,255,255,.55) 0%, transparent 100%),
      radial-gradient(1px   1px   at 22% 80%, rgba(249,115,22,.8)  0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 88% 45%, rgba(255,255,255,.6)  0%, transparent 100%),
      radial-gradient(1px   1px   at 38% 32%, rgba(251,191,36,.7)  0%, transparent 100%),
      radial-gradient(2px   2px   at 65% 85%, rgba(255,255,255,.45) 0%, transparent 100%);
  }

  .bp-char {
    position: absolute; bottom: 0; height: 78%; max-height: 560px;
    object-fit: contain; pointer-events: none;
    filter: drop-shadow(0 0 24px rgba(251, 191, 36, .25)) drop-shadow(0 16px 40px rgba(0, 0, 0, .35));
  }
  .bp-char-eli { left: 0; transform: translateX(-4%); animation: bp-float-eli 6s ease-in-out infinite; }
  .bp-char-ube { right: 0; transform: translateX(4%); animation: bp-float-ube 6s ease-in-out infinite 1.8s; }
  @keyframes bp-float-eli { 0%, 100% { transform: translateX(-4%) translateY(0); } 50% { transform: translateX(-4%) translateY(-18px); } }
  @keyframes bp-float-ube { 0%, 100% { transform: translateX(4%) translateY(0); } 50% { transform: translateX(4%) translateY(-18px); } }

  .bp-hero-center {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    max-width: 520px; width: 100%;
  }

  .bp-hero-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255, 255, 255, .18);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 50px; padding: 6px 20px;
    font-family: var(--font-body);
    font-size: 12px; font-weight: 800; color: #fff;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .bp-hero-badge svg { width: 13px; height: 13px; fill: #fbbf24; }

  .bp-hero-title {
    font-family: var(--font-title);
    font-size: 2.7rem; font-weight: 900; line-height: 1.1; color: #fff;
    margin: 0 0 14px; letter-spacing: -.5px;
    text-shadow: 0 4px 24px rgba(0, 0, 0, .25);
  }
  .bp-hero-title-accent {
    background: linear-gradient(95deg, #fbbf24 0%, #f97316 55%, #fde68a 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 2px 8px rgba(249,115,22,.5));
  }

  .bp-hero-sub {
    color: rgba(255, 255, 255, .80);
    font-size: 1rem; margin: 0 0 30px; line-height: 1.6;
    text-shadow: 0 1px 4px rgba(0,0,0,.2);
  }

  .bp-maintenance-card {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    background: rgba(255, 255, 255, .13);
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 24px; padding: 36px 48px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(76, 29, 149, .35);
    width: 100%; max-width: 360px;
  }

  .bp-maintenance-icon-ring {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
    border: 2px solid rgba(251, 191, 36, .55);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 28px rgba(251, 191, 36, .3);
  }
  .bp-maintenance-icon-ring svg { width: 34px; height: 34px; fill: #fbbf24; animation: bp-spin 4s linear infinite; transform-origin: 50% 50%; }
  @keyframes bp-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .bp-maintenance-label {
    font-family: var(--font-body);
    color: #fff; font-size: 1.1rem; font-weight: 800; letter-spacing: .5px; margin: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,.25);
  }

  .bp-maintenance-dots { display: flex; gap: 10px; }
  .bp-maintenance-dots span {
    width: 10px; height: 10px; border-radius: 50%; background: #fbbf24;
    animation: bp-dot-bounce 1.4s ease-in-out infinite; display: block;
  }
  .bp-maintenance-dots span:nth-child(2) { animation-delay: .2s; background: #f97316; }
  .bp-maintenance-dots span:nth-child(3) { animation-delay: .4s; background: #a78bfa; }
  @keyframes bp-dot-bounce { 0%, 80%, 100% { transform: scale(.7); opacity: .5; } 40% { transform: scale(1.2); opacity: 1; } }

  @media (max-width: 1199px) {
    .bp-char { height: 64%; max-height: 450px; }
    .bp-hero-title { font-size: 2.3rem; }
    .bp-hero-center { max-width: 480px; }
  }
  @media (max-width: 991px) {
    .bp-hero { padding: 60px 16px 220px; align-items: flex-start; min-height: auto; }
    .bp-char { height: 44%; max-height: 300px; opacity: .7; }
    .bp-char-eli { left: -10px; }
    .bp-char-ube { right: -10px; }
    .bp-hero-center { max-width: 100%; }
    .bp-hero-title { font-size: 2rem; }
    .bp-hero-sub { font-size: .9rem; margin-bottom: 20px; }
  }
  @media (max-width: 767px) {
    .bp-hero { padding: 60px 14px 195px; }
    .bp-char { height: 38%; max-height: 240px; opacity: .55; }
    .bp-char-eli { left: -8px; }
    .bp-char-ube { right: -8px; }
    .bp-hero-title { font-size: 1.75rem; }
    .bp-hero-sub { font-size: .85rem; }
    .bp-hero-center { max-width: 100%; }
    .bp-hero-badge { font-size: 10px; padding: 4px 14px; letter-spacing: 1.2px; }
  }
  @media (max-width: 575px) {
    .bp-hero { padding: 55px 12px 170px; }
    .bp-char { height: 32%; max-height: 200px; opacity: .45; }
    .bp-hero-title { font-size: 1.5rem; letter-spacing: -.3px; }
    .bp-hero-sub { font-size: .8rem; margin-bottom: 16px; }
    .bp-hero-badge { font-size: 9.5px; padding: 4px 12px; }
  }
  @media (max-width: 380px) {
    .bp-hero { padding: 50px 10px 155px; }
    .bp-char { height: 28%; max-height: 170px; opacity: .35; }
    .bp-hero-title { font-size: 1.35rem; }
  }
</style>
</head>
<body>
  <div class="bp-hero">
    <div class="bp-orb bp-orb-1"></div>
    <div class="bp-orb bp-orb-2"></div>
    <div class="bp-orb bp-orb-3"></div>
    <div class="bp-orb bp-orb-4"></div>
    <div class="bp-stars"></div>

    <img src="/maintenance-assets/valeria.png" class="bp-char bp-char-eli" alt=""/>
    <img src="/maintenance-assets/mateo.png" class="bp-char bp-char-ube" alt=""/>

    <div class="bp-hero-center">
      <div class="bp-hero-badge">
        <svg viewBox="0 0 512 512"><path d="M481.156 62.234c-6.531-6.531-17.125-6.531-23.656 0l-64.469 64.469-45.25-45.25 64.469-64.469c6.531-6.531 6.531-17.125 0-23.656-30.813-30.813-80.75-30.813-111.563 0-25.75 25.75-29.906 64.531-12.531 94.719L114.406 261.75c-30.188-17.375-68.969-13.219-94.719 12.531-30.813 30.813-30.813 80.75 0 111.563 30.813 30.813 80.75 30.813 111.563 0 25.75-25.75 29.906-64.531 12.531-94.719l173.75-173.75c30.188 17.375 68.969 13.219 94.719-12.531 30.813-30.812 30.813-80.75-.093-111.61z"/></svg>
        MANTENIMIENTO
      </div>

      <h1 class="bp-hero-title">
        Estamos mejorando<br/>
        <span class="bp-hero-title-accent">LotoAnálisis</span>
      </h1>

      <p class="bp-hero-sub">
        Estamos realizando una actualización del sistema.<br/>
        En breve estaremos de vuelta con todo funcionando.
      </p>

      <div class="bp-maintenance-card">
        <div class="bp-maintenance-icon-ring">
          <svg viewBox="0 0 512 512"><path d="M487.4 315.7l-42.6-24.6c4.3-23.2 4.3-47 0-70.2l42.6-24.6c4.9-2.8 7.1-8.6 5.5-14-11.1-35.6-30-67.8-54.7-94.6-3.8-4.1-10-5.1-14.8-2.3l-42.6 24.6c-18.1-15.5-38.9-27.4-61.4-35.1V25.8c0-5.6-3.9-10.5-9.4-11.7-36.7-8.2-74.3-7.8-109.2 0-5.5 1.2-9.4 6.1-9.4 11.7v49.2c-22.6 7.8-43.3 19.6-61.4 35.1L88.7 85.2c-4.9-2.8-11-1.9-14.8 2.3-24.7 26.7-43.6 58.9-54.7 94.6-1.7 5.4.6 11.2 5.5 14L67.3 220.9c-4.3 23.2-4.3 47 0 70.2l-42.6 24.6c-4.9 2.8-7.1 8.6-5.5 14 11.1 35.6 30 67.8 54.7 94.6 3.8 4.1 10 5.1 14.8 2.3l42.6-24.6c18.1 15.5 38.9 27.4 61.4 35.1v49.2c0 5.6 3.9 10.5 9.4 11.7 36.7 8.2 74.3 7.8 109.2 0 5.5-1.2 9.4-6.1 9.4-11.7v-49.2c22.6-7.8 43.3-19.6 61.4-35.1l42.6 24.6c4.9 2.8 11 1.9 14.8-2.3 24.7-26.7 43.6-58.9 54.7-94.6 1.6-5.4-.6-11.2-5.5-14zM256 336c-44.1 0-80-35.9-80-80s35.9-80 80-80 80 35.9 80 80-35.9 80-80 80z"/></svg>
        </div>
        <p class="bp-maintenance-label">Volvemos pronto</p>
        <div class="bp-maintenance-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
